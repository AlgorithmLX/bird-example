router id 0.0.0.0; # change this on every route. need unique

protocol device {
	scan time 10;
}

protocol kernel {
	ipv4 {
		import none;
		export all;
	};
}

protocol ospf v2 ospf1 {
	ipv4 {
		import all;
		export none;
	};

	area 0.0.0.0 {
		# gre interface
		interface "gre0" {
			type ptp;
			cost 10;
			hello 10;
			dead count 4;
			stub no;
		};

		interface "eth1" { stub yes; };
		interface "eth2" { stub yes; };
		# other interfaces. stub yes enables announceing
	};
}
