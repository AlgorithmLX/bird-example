router id 0.0.0.0; # change this on every route. need unique

protocol device {}

protocol kernel {
	ipv4 {
		import none;
		export all;
	};
}

protocol ospf v2 ospf1 {
	ipv4 {
		import all;
		export none;
	};

	area 0.0.0.0 {
		# gre interface
		interface "gre0" {
			type ptp;			

			authentication cryptographic;
			password "passwordlol" {
				id 1;
				algorithm hmac sha256;
			}
		};

		interface "eth1" { stub yes; };
		interface "eth2" { stub yes; };
		# other interfaces. stub yes enables announceing
	};
}
